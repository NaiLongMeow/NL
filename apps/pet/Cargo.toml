[package]
name = "nl-pet"
description = "NL desktop pet: a transparent, always-on-top window that renders the character"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# tao + wry are the windowing and webview layers underneath Tauri. The pet uses
# them directly because it needs only one transparent window and a webview,
# not Tauri's application framework (see docs/architecture.md, "桌面端").
tao.workspace = true
wry.workspace = true
