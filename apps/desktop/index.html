<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NL</title>
    <style>
      /* Colors and type come from the design tokens (@nl/tokens, imported by
         src/main.ts), which also switch to the dark theme with the system. */
      html, body {
        margin: 0;
        height: 100%;
        font-family: var(--nl-type-ui-font-family);
        font-size: var(--nl-type-ui-font-size);
        line-height: var(--nl-type-ui-line-height);
        background: var(--nl-color-surface-app);
        color: var(--nl-color-ink-primary);
      }
      main { display: grid; grid-template-rows: 1fr auto; height: 100%; }
      canvas { width: 100%; height: 100%; display: block; }
      p { margin: 0; padding: var(--nl-space-4); text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="stage"></canvas>
      <p>NL 桌面端：聊天与设置界面尚未实现</p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
